security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            entry_point: App\UI\Http\Security\JsonAuthenticationErrorHandler
            access_token:
                token_handler: App\Infrastructure\Security\ApiAccessTokenHandler
                failure_handler: App\UI\Http\Security\JsonAuthenticationErrorHandler

    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Niski koszt haszowania — testy nie muszą czekać na bcrypt/argon.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
